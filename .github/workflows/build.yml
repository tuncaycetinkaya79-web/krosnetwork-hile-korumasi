name: Jar Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Derle
        run: mvn -B clean package
      - name: Jar yukle
        uses: actions/upload-artifact@v4
        with:
          name: krosnetworkhilekorumasi
          path: target/krosnetworkhilekorumasi.jar
